name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payroll" --health-interval 5s --health-retries 10
    env:
      PAYROLL_TEST_DATABASE_URL: postgresql+psycopg://payroll:payroll@localhost:5432/payroll_test
      PAYROLL_DATABASE_URL: postgresql+psycopg://payroll:payroll@localhost:5432/payroll_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app tests
      - run: pytest
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
